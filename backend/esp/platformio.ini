; SmartWatt ESP32 firmware — PlatformIO project
; Board: ESP32 DevKit V1 | Framework: ESP-IDF | Mode: dummy current readings
;
; HOW TO FLASH (VS Code with PlatformIO extension):
;   1. File -> Open Folder -> select this `esp/` folder
;      (PlatformIO will auto-install the ESP32 toolchain on first build)
;   2. Join your PC to the SAME WiFi/hotspot as below so the ESP can reach
;      the backend. Then check your PC IP and update BACKEND_POST_URL if needed:
;        PowerShell: Get-NetIPAddress -AddressFamily IPv4 | Format-Table IPAddress,InterfaceAlias
;   3. Start the backend:  cd backend  ->  uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
;      (--host 0.0.0.0 is required so the ESP on the LAN can connect.
;       Allow Python/uvicorn through Windows Firewall on first run.)
;   4. PlatformIO sidebar -> env:esp32dev -> Upload (ESP on COM5)
;   5. PlatformIO -> Monitor to watch dummy readings + HTTP POST logs.
;   6. Frontend: npm run dev -> open /connect -> "Connect Device".
;
; DUMMY vs REAL SENSOR: -DSMARTWATT_DUMMY_MODE=1 sends varying simulated
; current (no hardware). Set to =0 for a real SCT-013 on GPIO34.

[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM5
monitor_port = COM5

; --- SmartWatt config (overrides defaults in main/main.c) ---
; TODO: after joining your PC to the phone hotspot, replace the IP below
; with your PC's hotspot IP (often 192.168.43.x), e.g.
; http://192.168.43.10:8000/api/telemetry/ingest
build_flags =
  -DSMARTWATT_DUMMY_MODE=1
  -DWIFI_SSID=\"Mark50\"
  -DWIFI_PASSWORD=\"MaazBaig\"
  -DBACKEND_POST_URL=\"http://192.168.1.7:8000/api/telemetry/ingest\"
  -DDEVICE_ID=\"esp32_sct013_res_01\"
  -DTRANSFORMER_ID=\"TX-RES-01\"
